# Production nginx configuration for Atomiser.
# Place this file in /etc/nginx/sites-available/atomiser and symlink it from
# sites-enabled, then reload nginx.

upstream atomiser_app {
    server unix:/run/atomiser/atomiser.sock fail_timeout=0;
}

# Rate-limit zones for authentication endpoints.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

server {
    listen 80;
    server_name example.com;
    # Redirect all HTTP traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/atomiser-dummy;

    # Maximum upload body size. nginx rejects oversize uploads before they
    # reach the app (the browser then sees ERR_CONNECTION_RESET, because the
    # body is still streaming when nginx closes the connection). Keep this in
    # sync with MAX_UPLOAD_MB in /etc/atomiser/atomiser.env (value in MB).
    client_max_body_size 500M;

    # Public static assets served directly by nginx.
    location /static/ {
        alias /opt/atomiser/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Internal location used by the app for authenticated video/thumbnail streaming.
    # The app returns an X-Accel-Redirect header and nginx serves the file here.
    # This location MUST NOT be reachable directly from the outside.
    location /internal/ {
        internal;
        alias /opt/atomiser/uploads/;
        add_header Accept-Ranges bytes;
    }

    # Thumbnail endpoint still goes through the app for authorisation, but the
    # actual bytes are served by the internal alias above once authorised.
    location /thumb/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass http://atomiser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Accel-Redirect;
    }

    # Rate-limit login/registration to slow brute force and invite exhaustion.
    location ~ ^/auth/(login|register|passkey/login) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://atomiser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Accel-Redirect;
    }

    # Single-shot upload (small files / no-JS fallback). Rate-limited.
    location = /upload {
        limit_req zone=upload burst=5 nodelay;
        proxy_pass http://atomiser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Accel-Redirect;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Chunked upload endpoints (POST /upload/chunk, /upload/complete).
    # Each request carries one <100 MB chunk so it fits through Cloudflare's
    # edge body limit; a large file is many sequential chunks, so the tight
    # 10 r/m auth-upload limit does NOT apply here (only the server-level
    # client_max_body_size and generous timeouts do).
    location /upload/ {
        proxy_pass http://atomiser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Accel-Redirect;
        client_body_timeout 600s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else goes to the FastAPI app.
    location / {
        proxy_pass http://atomiser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_hide_header X-Accel-Redirect;
    }
}
