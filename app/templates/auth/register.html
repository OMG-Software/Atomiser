{% extends "base.html" %}
{% block title %}Register — {{ site_title|default('Atomiser Site') }}{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Accept your invite</h1>
  <p class="meta" style="margin-bottom:0.5rem;">This community is invite-only. Use your invite link to create an account.</p>
  <form method="POST" action="/auth/register">
    <input type="hidden" name="csrf" value="{{ request.state.csrf_token }}">

    <label for="token">Invite token</label>
    <input type="text" id="token" name="token" value="{{ token }}" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="display_name">Display name</label>
    <input type="text" id="display_name" name="display_name" required maxlength="80">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="12" autocomplete="new-password">
    <p class="field-hint">At least 12 characters, with letters and digits.</p>

    <button type="submit" class="btn btn-block" style="margin-top:1.25rem;">Create account</button>
  </form>
</div>
{% endblock %}
